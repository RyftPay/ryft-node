name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run; pack and validate only — nothing is released to npm'
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run bundle
      - run: npm publish ${{ inputs.dry-run && '--dry-run' || '' }}
